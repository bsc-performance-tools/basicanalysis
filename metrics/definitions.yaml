version: 1
sources:
  pop_standard_metrics:
    title: POP Standard Metrics for Performance Analysis of Hybrid Parallel Applications
    kind: external
  ispdc2020_hybrid:
    title: POP Multiplicative Hybrid Metrics
    kind: publication
  basicanalysis_host_device:
    title: GPU TALP Host/Device Metrics
    kind: internal
  basicanalysis_openmp_runtime:
    title: Isolated OpenMP Efficiency Metrics (TALP-based)
    kind: internal
  basicanalysis_hybrid_openmp_decomposition:
    title: 'Hybrid POP Metrics - BSC Models: MPI+OpenMP Serialization and Transfer Decomposition'
    kind: internal
  basicanalysis_general_metrics:
    title: BasicAnalysis General Performance Metrics
    kind: internal
  basicanalysis_io_metrics:
    title: BasicAnalysis File I/O Metrics
    kind: internal  
  basicanalysis_gpu_hwc:
    title: BasicAnalysis Device Hardware Counter Metrics (nsys2prv GPU metrics)
    kind: internal
metrics:
  global_eff:
    name: Global Efficiency
    short_name: Global
    family: global
    analysis_level: application
    metric_type: compound_efficiency
    definition:   Top-level efficiency used to assess the overall performance efficiency of the application. 
      It combines the effects of parallel execution and the scalability of useful computation as resources increase.
    formula:
      text: GE = PE × CompScale
      latex: GE = PE \\times CompScale
    interpretation:
      low: Low values indicate that parallel-execution overhead, poor computation scaling, or both limit the overall
        parallel performance.
      high: High values indicate small parallel-execution overhead and good computation scaling relative to the
        selected reference execution.
      above_100: Values above 100% can occur when favorable computation scaling more than compensates parallel-execution
        overhead; interpret them relative to the reference execution.
    typical_causes:
    - Parallel runtime overhead
    - Load imbalance
    - Communication overhead
    - Poor computation scalability
    next_steps:
    - Inspect Parallel Efficiency.
    - Inspect Computation Scalability.
    children:
    - parallel_eff
    - comp_scale
    sources:
    - pop_standard_metrics
    - ispdc2020_hybrid
  parallel_eff:
    name: Parallel Efficiency
    short_name: PE
    family: global
    analysis_level: application
    metric_type: compound_efficiency
    definition:   Measures the efficiency of the parallel execution. It reflects losses
      associated with distributing computational work across parallel execution
      units and with the communication, synchronization, or runtime activity
      required to coordinate their execution.
    formula:
      text: PE = average useful computation time / total runtime = LB × CommE
      latex: PE = \frac{\overline{Useful}}{T} = LB \times CommE
      variables:
        Useful: Useful computation time across the resources considered by the model
        T: Total runtime
        LB: Load Balance
        CommE: Communication Efficiency
    interpretation:
      low: Low values indicate inefficiency due to load imbalance, communication, synchronization, or other parallel-runtime
        overhead.
      high: High values indicate that most of the execution time available to the parallel resources is spent in
        useful computation.
      above_100: Values above 100% are not expected for Parallel Efficiency and should be checked.
    typical_causes:
    - Load imbalance
    - Synchronization
    - Communication
    - Parallel runtime overhead
    next_steps:
    - Inspect Load Balance.
    - Inspect Communication Efficiency.
    children:
    - load_balance
    - comm_eff
    sources:
    - pop_standard_metrics
    - ispdc2020_hybrid
  load_balance:
    name: Load Balance
    short_name: LB
    family: global
    analysis_level: application
    metric_type: efficiency
    definition: Measures how evenly useful computation is distributed across the parallel execution units.
    formula:
      text: LB = average useful time / maximum useful time
      latex: LB = \\frac{\\frac{1}{P}\\sum_{i=1}^{P} Useful_i}{\\max_i(Useful_i)}
      variables:
        P: Number of resources in the selected model
        Useful_i: Useful computation time of resource i
    interpretation:
      low: Low values indicate that useful computation is unevenly distributed across resources.
      high: High values indicate an even distribution of useful computation across resources.
      above_100: Values above 100% are not expected for Load Balance and should be checked.
    typical_causes:
    - Uneven domain decomposition
    - Irregular work
    - Different iteration counts
    - Resource interference
    next_steps:
    - Inspect useful time per resource.
    - Locate phases where the imbalance originates.
    children: []
    sources:
    - pop_standard_metrics
    - ispdc2020_hybrid
  comm_eff:
    name: Communication Efficiency
    short_name: CommE
    family: global
    analysis_level: application
    metric_type: compound_efficiency
    definition: Measures the efficiency of parallel execution with respect to communication,
     synchronization, and other parallel-runtime overheads.
    formula:
      text: CommE = maximum useful computation time / total runtime = SerE × TE
      latex: CommE = \frac{\max_i(Useful_i)}{T} = SerE \times TE
      variables:
        Useful_i: Useful computation time of resource i
        T: Total runtime
        SerE: Serialization Efficiency
        TE: Transfer Efficiency
    interpretation:
      low: Low values indicate that communication, synchronization, or parallel-runtime activity consumes a significant
        fraction of the execution time.
      high: High values indicate that communication-related and parallel-runtime overhead is small.
      above_100: Values above 100% are not expected for Communication Efficiency and should be checked.
    typical_causes:
    - Waiting at communication points
    - Data transfer time
    - Synchronization
    - Runtime management
    next_steps:
    - Inspect Serialization Efficiency and Transfer Efficiency when available.
    - Otherwise, inspect communication, synchronization, and parallel-runtime activity in the trace.
    children:
    - serial_eff
    - transfer_eff
    sources:
    - pop_standard_metrics
    - ispdc2020_hybrid
  serial_eff:
    name: MPI Serialization Efficiency
    short_name: MPI Ser
    family: mpi
    analysis_level: runtime_specific
    metric_type: efficiency
    definition: Measures communication inefficiency caused by dependencies between MPI ranks that make ranks wait
      at communication points (temporal serialization), rather than by physical data-transfer time. It is obtained
      from an ideal-network simulation with zero latency and infinite bandwidth.
    formula:
      text: SerE = maximum useful computation time on ideal network / total runtime on ideal network
      latex: SerE = \frac{\max_i(Useful_i^{ideal})}{T_{ideal}}
      variables:
        Useful_i^{ideal}: Useful computation time of MPI rank i in the ideal-network simulation
        T_ideal: Total runtime simulated with zero latency and infinite bandwidth
    interpretation:
      low: Low values indicate significant waiting caused by dependencies and temporal serialization between MPI
        ranks.
      high: High values indicate little communication loss due to temporal serialization.
      above_100: Values above 100% are not expected and may indicate inconsistencies in the simulation or input
        data.
    typical_causes:
    - Late senders
    - Collective synchronization
    - Dependencies between ranks
    - Load imbalance propagated into MPI
    next_steps:
    - Compare original and ideal-network timelines.
    - Identify late ranks at communication points.
    children: []
    sources:
    - pop_standard_metrics
    - ispdc2020_hybrid
  transfer_eff:
    name: MPI Transfer Efficiency
    short_name: MPI Trans
    family: mpi
    analysis_level: runtime_specific
    metric_type: efficiency
    definition: Measures communication inefficiency attributable to the physical time required to transfer data
      over the real network. It compares the runtime simulated on an ideal network with the runtime on the real
      network.
    formula:
      text: TE = total runtime on ideal network / total runtime on real network
      latex: TE = \frac{T_{ideal}}{T_{real}}
      variables:
        T_ideal: Total runtime simulated with zero latency and infinite bandwidth
        T_real: Total runtime on the real network
    interpretation:
      low: Low values indicate that physical data-transfer cost is a significant source of communication inefficiency.
      high: High values indicate that physical data-transfer overhead is small.
      above_100: Values above 100% are not expected and may indicate inconsistencies in the simulation or input
        data.
    typical_causes:
    - Large message volume
    - Many small messages
    - Network contention
    - Inefficient collectives
    next_steps:
    - Inspect message sizes and communication frequency.
    - Inspect network topology and process mapping.
    children: []
    sources:
    - pop_standard_metrics
    - ispdc2020_hybrid
  comp_scale:
    name: Computation Scalability
    short_name: CompScale
    family: global
    analysis_level: application
    metric_type: compound_scalability
    definition: Measures how the total time spent in useful computation changes relative to a reference execution
      as the application scales.
    formula:
      text: CompScale = total useful computation time at reference / total useful computation time at target
      latex: CompScale = \frac{\sum_i Useful_{i,ref}}{\sum_i Useful_{i,target}}
    interpretation:
      low: Low values indicate that the total useful-computation cost increases at scale relative to the reference
        execution.
      high: High values indicate that the total useful-computation cost is preserved relative to the reference execution.
      above_100: Values above 100% indicate that the target execution requires less total useful-computation time
        than the reference, corresponding to favorable or superlinear computation scaling.
    typical_causes:
    - Increase in total useful instruction count
    - Reduced IPC due to contention for shared resources
    - Reduced processor frequency
    next_steps:
    - Inspect IPC Scalability.
    - Inspect Instruction Scalability.
    - Inspect Frequency Scalability.
    children:
    - ipc_scale
    - inst_scale
    - freq_scale
    sources:
    - pop_standard_metrics
    - ispdc2020_hybrid
  ipc_scale:
    name: IPC Scalability
    short_name: IPC
    family: global
    analysis_level: scalability
    metric_type: scalability
    definition: Measures how the number of instructions executed per processor cycle changes
     relative to a reference execution as the application scales.
    formula:
      text: IPCScale = IPC_target / IPC_reference
      latex: IPCScale = \\frac{IPC_{target}}{IPC_{ref}}
    interpretation:
      low: Low values indicate that fewer instructions are executed per processor cycle than in the reference execution.
      high: Values near 100% indicate preserved IPC relative to the reference; higher values indicate improved IPC.
      above_100: Values above 100% indicate higher IPC than in the reference execution.
    typical_causes:
    - Cache misses
    - Memory-bandwidth saturation
    - Pipeline stalls
    - NUMA effects
    next_steps:
    - Inspect cache and memory counters.
    - Inspect NUMA placement and memory bandwidth.
    children: []
    sources:
    - pop_standard_metrics
    - ispdc2020_hybrid
  inst_scale:
    name: Instruction Scalability
    short_name: Inst
    family: global
    analysis_level: scalability
    metric_type: scalability
    definition: Measures how the number of instructions executed during useful computation
     changes relative to a reference execution as the application scales.
    formula:
      text: InstScale = instructions_reference / instructions_target
      latex: InstScale = \\frac{Instructions_{ref}}{Instructions_{target}}
    interpretation:
      low: Low values indicate that more instructions are executed during useful computation than in the reference execution.
      high: Values near 100% indicate that the total useful instruction count is preserved relative to the reference
        execution.
      above_100: Values above 100% indicate fewer total useful instructions than in the reference execution.
    typical_causes:
    - Additional parallel bookkeeping
    - Algorithmic work growth
    - Redundant computation
    - Instrumentation effects
    next_steps:
    - Compare useful instruction counts by phase.
    - Check for redundant or replicated work.
    children: []
    sources:
    - pop_standard_metrics
    - ispdc2020_hybrid
  freq_scale:
    name: Frequency Scalability
    short_name: Freq
    family: global
    analysis_level: scalability
    metric_type: scalability

    definition: >
      Measures how the processor frequency during useful computation changes
      relative to a reference execution as the application scales.

    formula:
      text: >
        FreqScale =
        (UsefulCycles_target / UsefulTime_target) /
        (UsefulCycles_reference / UsefulTime_reference)

      latex: >
        FreqScale =
        \frac{UsefulCycles_{target}/UsefulTime_{target}}
        {UsefulCycles_{ref}/UsefulTime_{ref}}

      variables:
        UsefulCycles: Total CPU cycles measured during useful computation
        UsefulTime: Total useful computation time used by the performance model

    interpretation:
      low: >
        Low values indicate that useful computation executes at a lower processor frequency than in the reference execution.
      high: >
        Values near 100% indicate that the effective processor frequency during
        useful computation is preserved relative to the reference execution.
      above_100: >
        Values above 100% indicate a higher effective processor frequency during
        useful computation than in the reference execution.

    typical_causes:
      - Power limits
      - Thermal throttling
      - Turbo-frequency changes
      - Changes in CPU core occupancy

    next_steps:
      - Inspect CPU frequency and power behavior.
      - Compare frequency behavior across the analyzed configurations.

    children: []

    sources:
      - pop_standard_metrics
      - ispdc2020_hybrid
  hybrid_eff:
    name: Hybrid Parallel Efficiency
    short_name: Hybrid PE
    family: hybrid
    analysis_level: composed_runtime
    metric_type: compound_efficiency
    definition: Measures the parallel efficiency of the complete hybrid execution,
     accounting for the combined contribution of the active parallel runtimes.
    formula:
      text: HybridPE = HybridLB × HybridCommE = MPI_PE × Runtime_PE
      latex: HybridPE = HybridLB \times HybridCommE = MPI\_PE \times Runtime\_PE
    interpretation:
      low: Low values indicate that one or more active parallel runtimes contribute substantial inefficiency.
      high: High values indicate that the active parallel runtimes introduce little parallel inefficiency.
      above_100: Values above 100% are not expected for Hybrid Parallel Efficiency and should be checked.
    typical_causes:
    - MPI inefficiency
    - Inner-runtime inefficiency
    - Interaction between runtimes
    next_steps:
    - Compare MPI and inner-runtime contributions.
    children:
    - mpi_parallel_eff
    - runtime_parallel_eff
    sources:
    - pop_standard_metrics
    - ispdc2020_hybrid
  mpi_parallel_eff:
    name: MPI Parallel Efficiency
    short_name: MPI PE
    family: mpi
    analysis_level: runtime_specific
    metric_type: compound_efficiency
    definition:   Measures the contribution of the MPI level to the Parallel Efficiency of
      the hybrid execution. From the MPI perspective, activity outside MPI calls,
      including computation and inner-runtime activity, is considered productive.
    formula:
      text: MPI_PE = sum OutsideMPI_i / (P × T) = MPI_LB × MPI_CommE
      latex: MPI\_PE = \frac{\sum_{i=1}^{P} OutsideMPI_i}{P \cdot T} = MPI\_LB \times MPI\_CommE
      variables:
        OutsideMPI_i: Time outside MPI for MPI rank i
        P: Number of MPI ranks
        T: Total runtime
    interpretation:
      low: >
        Low values indicate substantial efficiency loss attributed to the MPI
        level. Some MPI waiting may, however, be caused by delays originating in
        the inner runtime, because the model attributes waiting observed inside
        MPI to the MPI component first.
      high: >
        High values indicate that little parallel inefficiency is attributed to
        the MPI level.
      above_100: >
        Values above 100% are not expected for the directly computed MPI component
        and should be checked.
    typical_causes:
    - MPI load imbalance
    - MPI synchronization
    - MPI transfer cost
    next_steps:
      - Inspect MPI Load Balance and MPI Communication Efficiency.
      - When MPI waiting is significant, check whether delayed MPI ranks originate
        from imbalance or overhead in the inner runtime.
    children:
    - mpi_load_balance
    - mpi_comm_eff
    sources:
    - ispdc2020_hybrid
  mpi_load_balance:
    name: MPI Load Balance
    short_name: MPI LB
    family: mpi
    analysis_level: runtime_specific
    metric_type: efficiency
    definition: Measures how evenly time spent outside MPI calls is distributed across
     MPI ranks.
    formula:
      text: MPI_LB = average OutsideMPI / maximum OutsideMPI
      latex: MPI\\_LB = \\frac{\\frac{1}{P}\\sum_i OutsideMPI_i}{\\max_i(OutsideMPI_i)}
    interpretation:
      low: Low values indicate that time outside MPI is unevenly distributed across ranks.
      high: High values indicate a balanced distribution of time outside MPI across ranks.
      above_100: Values above 100% are not expected for the directly computed MPI component and should be checked.
    typical_causes:
    - Uneven rank workload
    - Process mapping
    - Rank-specific delays
    next_steps:
    - Inspect the distribution of time outside MPI calls across MPI ranks.
    - Identify ranks or execution phases responsible for the imbalance.
    children: []
    sources:
    - ispdc2020_hybrid
  mpi_comm_eff:
    name: MPI Communication Efficiency
    short_name: MPI Comm
    family: mpi
    analysis_level: runtime_specific
    metric_type: compound_efficiency
    definition: Measures the efficiency of the MPI execution with respect to communication,
      synchronization, and other MPI runtime overheads. Activity outside MPI,
      including computation and inner-runtime activity, is considered productive
      from the MPI perspective.
    formula:
      text: MPI_CommE = maximum OutsideMPI / runtime
      latex: MPI\\_CommE = \\frac{\\max_i(OutsideMPI_i)}{T}
    interpretation:
      low: Low values indicate significant efficiency loss associated with MPI communication.
      high: High values indicate that MPI communication introduces little efficiency loss.
      above_100: Values above 100% are not expected for the directly computed MPI component and should be checked.
    typical_causes:
    - Temporal serialization
    - Network transfer time
    - Collective synchronization
    next_steps:
      - Inspect MPI Serialization Efficiency and MPI Transfer Efficiency when available.
      - Otherwise, inspect MPI communication and synchronization activity in the trace.
    children:
    - serial_eff
    - transfer_eff
    sources:
    - ispdc2020_hybrid
  runtime_parallel_eff:
    aliases:
    - omp_parallel_eff
    name_template: '{runtime} Parallel Efficiency'
    short_name_template: '{runtime} PE'
    family_template: '{runtime_family}'
    analysis_level: runtime_contribution
    metric_type: compound_efficiency
    definition_template: >
      Measures the contribution of the {runtime} level to the Parallel Efficiency
      of the complete hybrid execution after the MPI contribution has been
      separated. It is a derived contribution factor, not an isolated
      {runtime} efficiency.
    formula:
      text_template: '{runtime}_PE = HybridPE / MPI_PE'
      latex_template: '{runtime}\\_PE = \\frac{{HybridPE}}{{MPI\\_PE}}'
    interpretation:
      low_template: >
        Values below 100% indicate parallel inefficiency attributed to the
        {runtime} component after the MPI contribution has been separated.

      high_template: >
        Values near 100% indicate little additional parallel inefficiency
        attributed to the {runtime} component.

      above_100_template: >
        Values above 100% do not represent an isolated {runtime} efficiency greater
        than 100%. They indicate that the MPI-first decomposition has attributed
        more efficiency loss to the MPI level than is reflected in the complete
        hybrid Parallel Efficiency. This may occur when delays originating in the
        {runtime} level manifest as MPI waiting and are therefore attributed to MPI.
    typical_causes_template:
    - '{runtime} load imbalance'
    - '{runtime} communication, synchronization, or runtime overhead'
    next_steps_template:
    - Inspect the {runtime} contribution children.
    - Use an isolated {runtime} runtime-specific analysis when available.
    children:
    - runtime_load_balance
    - runtime_comm_eff
    sources:
    - ispdc2020_hybrid
  runtime_load_balance:
    aliases:
    - omp_load_balance
    name_template: '{runtime} Load Balance'
    short_name_template: '{runtime} LB'
    family_template: '{runtime_family}'
    analysis_level: runtime_contribution
    metric_type: efficiency
    definition_template: >
      Measures the contribution of the {runtime} level to the Load Balance of the
      complete hybrid execution. It is a derived contribution factor, not an
      isolated {runtime} load-balance efficiency.
    formula:
      text_template: '{runtime}_LB = HybridLB / MPI_LB'
      latex_template: '{runtime}\\_LB = \\frac{{HybridLB}}{{MPI\\_LB}}'
    interpretation:
      low_template: >
        Values below 100% indicate that the {runtime} level introduces additional
        load imbalance in the complete hybrid execution.

      high_template: >
        Values near 100% indicate that the {runtime} level introduces little
        additional load imbalance.

      above_100_template: >
        Values above 100% indicate that the complete hybrid execution is more
        load-balanced than the MPI-level execution view. The distribution of work
        at the {runtime} level therefore partially compensates load imbalance
        attributed to the MPI level. This is a relative contribution between the
        two execution views, not an isolated {runtime} load-balance efficiency
        greater than 100%.
    typical_causes_template:
    - Uneven work distribution associated with {runtime}
    next_steps_template:
      - Compare Hybrid Load Balance and MPI Load Balance.
      - Inspect the distribution of work across MPI ranks and {runtime} execution units.
      - Inspect an isolated {runtime} load-balance metric when available.
    children: []
    sources:
    - ispdc2020_hybrid
  runtime_comm_eff:
    aliases:
    - omp_comm_eff
    name_template: '{runtime} Communication Efficiency'
    short_name_template: '{runtime} Comm'
    family_template: '{runtime_family}'
    analysis_level: runtime_contribution
    metric_type: efficiency
    definition_template: >
      Measures the contribution of the {runtime} level to the Communication
      Efficiency of the complete hybrid execution. It reflects communication,
      synchronization, data movement, and runtime-management overheads associated
      with the {runtime} level after the MPI contribution has been separated.
      It is a derived contribution factor, not an isolated {runtime}
      communication efficiency.
    formula:
      text_template: '{runtime}_CommE = HybridCommE / MPI_CommE'
      latex_template: '{runtime}\\_CommE = \\frac{{HybridCommE}}{{MPI\\_CommE}}'
    interpretation:
      low_template: >
        Values below 100% indicate additional communication- or runtime-related
        inefficiency associated with the {runtime} level.
      high_template: >
        Values near 100% indicate little additional communication- or
        runtime-related inefficiency associated with the {runtime} level.
      above_100_template: >
        Values above 100% indicate that Hybrid Communication Efficiency is higher
        than MPI Communication Efficiency. The value therefore represents a
        positive relative contribution of the {runtime} level in the multiplicative
        decomposition, not an isolated {runtime} communication efficiency above
        100%. Cross-runtime interactions and the MPI-first attribution of waiting
        time may contribute to this behavior, so the cause should be confirmed from
        the trace.
    typical_causes_template:
    - '{runtime} synchronization'
    - '{runtime} runtime management'
    - Data movement
    next_steps_template:
      - Compare Hybrid Communication Efficiency and MPI Communication Efficiency.
      - Inspect an isolated {runtime} runtime-specific analysis when available.
      - For values above 100%, inspect MPI waiting together with the preceding {runtime} activity to identify possible cross-runtime effects.
    children: []
    sources:
    - ispdc2020_hybrid
  omp_serial_eff:
    name: OpenMP Serialization Efficiency
    short_name: OMP Ser
    family: openmp
    analysis_level: runtime_contribution
    metric_type: derived_efficiency
    definition: >
      Measures the contribution of the OpenMP runtime to Serialization Efficiency
      in the hybrid execution, characterizing efficiency losses associated with
      serialized execution and waiting at the OpenMP level. It is a derived
      contribution factor, not an isolated OpenMP Serialization Efficiency.
    formula:
      text: OMP_SerE = Hybrid_SerE / MPI_SerE
      latex: OMP\_SerE = \frac{Hybrid\_SerE}{MPI\_SerE}
      variables:
        Hybrid_SerE: Serialization Efficiency obtained from the hybrid simulation with MPI and OpenMP enabled under
          ideal network and ideal OpenMP-runtime conditions
        MPI_SerE: MPI Serialization Efficiency obtained from the MPI-only ideal-network simulation with OpenMP disabled
    derivation: The MPI-level simulation disables OpenMP and assumes an ideal network (zero latency and infinite
      bandwidth), isolating MPI serialization. The hybrid simulation keeps MPI and OpenMP enabled while assuming
      both an ideal network and an ideal OpenMP runtime. OpenMP runtime events such as fork-join, scheduling, and
      synchronization are removed, while the execution structure and dependencies are preserved. Under the multiplicative
      model, Hybrid_SerE = MPI_SerE × OMP_SerE; therefore OMP_SerE = Hybrid_SerE / MPI_SerE.
    assumptions:
    - The MPI-only simulation uses an ideal network.
    - The hybrid simulation uses an ideal network and an ideal OpenMP runtime.
    - OpenMP runtime events are removed in the ideal hybrid simulation, while execution structure and dependencies
      are preserved.
    - The MPI and OpenMP serialization contributions combine multiplicatively.
    depends_on:
    - hybrid_serial_eff
    - serial_eff
    interpretation:
      low: Values below 100% indicate structural limitations attributable to the OpenMP component, such as inherent
        dependencies or limited parallelism.
      high: Values near 100% indicate little additional OpenMP structural serialization.
      above_100: Values above 100% indicate a compensation effect in the multiplicative decomposition and are not
        direct optimization targets.
    typical_causes:
    - Inherent dependencies
    - Limited thread-level parallelism
    - Serialized OpenMP regions
    - Critical or ordered regions that constrain concurrency
    next_steps:
    - Compare Hybrid and MPI Serialization Efficiency.
    - Inspect serialized regions and synchronization in the OpenMP execution.
    - Inspect dependencies and the available thread-level concurrency.
    children: []
    sources:
    - basicanalysis_hybrid_openmp_decomposition
  omp_transfer_eff:
    name: OpenMP Transfer Efficiency
    short_name: OMP Trans
    family: openmp
    analysis_level: runtime_contribution
    metric_type: derived_efficiency
    definition: >
      Measures the contribution of the OpenMP runtime to Transfer Efficiency in
      the hybrid execution, characterizing efficiency losses associated with
      OpenMP runtime overheads such as synchronization, scheduling, fork/join
      activity, and thread management after serialization effects have been
      separated. It is a derived contribution factor, not an isolated OpenMP
      Transfer Efficiency or a measure of physical data transfer between threads.
    formula:
      text: OMP_TransferE = Hybrid_TransferE / MPI_TransferE
      latex: OMP\_TransferE = \frac{Hybrid\_TransferE}{MPI\_TransferE}
      variables:
        Hybrid_TransferE: Transfer Efficiency obtained from the hybrid simulation with MPI and OpenMP enabled under
          ideal network and ideal OpenMP-runtime conditions
        MPI_TransferE: MPI Transfer Efficiency obtained from the MPI-only ideal-network simulation with OpenMP disabled
    derivation: The MPI-level simulation disables OpenMP and assumes an ideal network, separating MPI serialization
      from MPI physical transfer effects. The hybrid simulation keeps MPI and OpenMP enabled under an ideal network
      and an ideal OpenMP runtime. OpenMP fork-join, scheduling, and synchronization runtime events are removed,
      while execution structure and dependencies remain. Under the multiplicative model, Hybrid_TransferE = MPI_TransferE
      × OMP_TransferE; therefore OMP_TransferE = Hybrid_TransferE / MPI_TransferE.
    assumptions:
    - The MPI-only simulation uses an ideal network.
    - The hybrid simulation uses an ideal network and an ideal OpenMP runtime.
    - OpenMP runtime events are removed in the ideal hybrid simulation, while execution structure and dependencies
      are preserved.
    - The MPI and OpenMP transfer contributions combine multiplicatively.
    depends_on:
    - hybrid_transfer_eff
    - transfer_eff
    interpretation:
      low: Values below 100% indicate significant OpenMP runtime overhead from synchronization, scheduling, fork/join
        activity, or thread management.
      high: Values near 100% indicate little additional OpenMP runtime-management overhead.
      above_100: >
        Values above 100% indicate that Hybrid Transfer Efficiency is higher than
        MPI Transfer Efficiency. The value is therefore a relative contribution
        produced by the multiplicative decomposition, not an isolated OpenMP
        Transfer Efficiency greater than 100%. The underlying cause should be
        confirmed from the simulation results and trace.
    typical_causes:
    - Frequent fork/join operations
    - OpenMP scheduling overhead
    - Barrier and synchronization overhead
    - Fine-grained parallel regions
    - Thread-management overhead
    next_steps:
    - Compare Hybrid and MPI Transfer Efficiency.
    - Inspect fork-join, scheduling, barriers, and synchronization events.
    - Check whether OpenMP parallel regions are too fine-grained.
    children: []
    sources:
    - basicanalysis_hybrid_openmp_decomposition
  omp_talp_parallel_eff:
    name: OpenMP Parallel Efficiency
    short_name: OMP PE
    family: openmp
    analysis_level: runtime_specific
    metric_type: compound_efficiency
    definition: >
      Measures the efficiency of the OpenMP execution, reflecting losses associated
      with serial execution outside OpenMP parallel regions, the distribution of
      useful computation across threads, and OpenMP scheduling, synchronization,
      and runtime overheads.
    formula:
      text: OMP_PE = OMP_Serial × OMP_LB × OMP_Sched = T_noOMP / (T_noOMP + T_OMP_serial + T_OMP_Imbal + T_OMP_sched)
      latex: OMP\_PE = OMP\_Serial \times OMP\_LB \times OMP\_Sched = \frac{T_{noOMP}}{T_{noOMP}+T^{OMP}_{serial}+T^{OMP}_{Imbal}+T^{OMP}_{sched}}
      variables:
        T_noOMP: Useful computation time plus MPI time outside OpenMP runtime overhead
        T_OMP_serial: Projected serial loss caused by execution outside OpenMP parallel regions
        T_OMP_Imbal: Load-imbalance loss reconstructed from useful time per thread inside OpenMP regions
        T_OMP_sched: OpenMP scheduling and fork/join runtime overhead
    interpretation:
      low: Low values indicate that one or more OpenMP-specific factors—serial execution, load imbalance, or scheduling/fork-join
        overhead—significantly affect the OpenMP execution.
      high: High values indicate small OpenMP-specific losses from serial execution, load imbalance, and runtime
        scheduling/fork-join overhead.
      above_100: Values above 100% are not expected for the isolated OpenMP efficiencies and should be checked.
    typical_causes:
    - Serial execution
    - Imbalance inside OpenMP regions
    - Scheduling and fork/join overhead
    next_steps:
    - Inspect OpenMP Serial Efficiency.
    - Inspect OpenMP Region Load Balance.
    - Inspect OpenMP Scheduling Efficiency.
    children:
    - omp_talp_serial_eff
    - omp_talp_load_balance
    - omp_talp_scheduling_eff
    sources:
    - basicanalysis_openmp_runtime
  omp_talp_serial_eff:
    name: OpenMP Serial Efficiency
    short_name: OMP Serial
    family: openmp
    analysis_level: runtime_specific
    metric_type: efficiency
    definition: >
      Measures the efficiency loss associated with serial execution outside OpenMP
      parallel regions, where the available OpenMP worker threads are not used for
      parallel computation.
    formula:
      text: OMP_Serial = T_noOMP / (T_noOMP + T_OMP_serial)
      latex: OMP\_Serial = \frac{T_{noOMP}}{T_{noOMP}+T^{OMP}_{serial}}
    interpretation:
      low: >
        Low values indicate that a significant fraction of the execution occurs
        serially outside OpenMP parallel regions, leaving available OpenMP worker
        threads unused for parallel computation.
      high: >
        High values indicate that serial execution outside OpenMP parallel regions
        represents only a small efficiency loss.
      above_100: >
        Values above 100% are not expected and should be checked.
    typical_causes:
    - Serial initialization or finalization
    - Small parallel coverage
    - Sequential regions between parallel regions
    next_steps:
      - Inspect useful computation outside OpenMP parallel regions and identify the dominant serial regions.
    children: []
    sources:
    - basicanalysis_openmp_runtime
  omp_talp_load_balance:
    name: OpenMP Region Load Balance
    short_name: OMP Region LB
    family: openmp
    analysis_level: runtime_specific
    metric_type: efficiency
    definition: >
      Measures how evenly useful computation is distributed among OpenMP threads
      inside parallel regions.
    formula:
      text: OMP_LB = (T_noOMP + T_OMP_serial) / (T_noOMP + T_OMP_serial + T_OMP_Imbal)
      latex: OMP\_LB = \frac{T_{noOMP}+T^{OMP}_{serial}}{T_{noOMP}+T^{OMP}_{serial}+T^{OMP}_{Imbal}}
    interpretation:
      low: Low values indicate uneven useful-work distribution among OpenMP threads inside parallel regions.
      high: High values indicate balanced useful computation among OpenMP threads inside parallel regions.
      above_100: Values above 100% are not expected and should be checked.
    typical_causes:
    - Uneven loop iterations
    - Irregular tasks
    - Static scheduling mismatch
    next_steps:
      - Inspect useful computation per thread and OpenMP parallel region.
      - Identify regions with the largest thread imbalance.
    children: []
    sources:
    - basicanalysis_openmp_runtime
  omp_talp_scheduling_eff:
    name: OpenMP Scheduling Efficiency
    short_name: OMP Sched
    family: openmp
    analysis_level: runtime_specific
    metric_type: efficiency
    definition: >
      Measures the efficiency of the OpenMP execution with respect to scheduling
      and fork/join runtime overheads.
    formula:
      text: OMP_Sched = (T_noOMP + T_OMP_serial + T_OMP_Imbal) / (T_noOMP + T_OMP_serial + T_OMP_Imbal + T_OMP_sched)
      latex: OMP\_Sched = \frac{T_{noOMP}+T^{OMP}_{serial}+T^{OMP}_{Imbal}}{T_{noOMP}+T^{OMP}_{serial}+T^{OMP}_{Imbal}+T^{OMP}_{sched}}
    interpretation:
      low: Low values indicate significant OpenMP runtime overhead due to scheduling or fork/join activity.
      high: High values indicate small OpenMP scheduling and fork/join overhead.
      above_100: Values above 100% are not expected and should be checked.
    typical_causes:
    - Dynamic scheduling with fine granularity
    - Frequent fork/join
    - Synchronization
    - Runtime management
    next_steps:
      - Inspect OpenMP scheduling and fork/join activity in the trace.
      - Identify parallel regions with frequent or fine-grained runtime activity.
    children: []
    sources:
    - basicanalysis_openmp_runtime
  host_global_eff:
    name: Host Global Efficiency
    short_name: Host Global
    family: host
    analysis_level: execution_domain
    metric_type: compound_efficiency
    definition: >
      Measures the overall efficiency of the Host execution domain, accounting for
      losses associated with parallel and accelerator-offload activity together
      with changes in the scalability of useful Host computation.
    formula:
      text: HostGE = HostPE × HostCompScale
      latex: HostGE = HostPE \times HostCompScale
    interpretation:
      low: >
        Low values indicate that parallel/offload overhead, changes in Host
        computation scalability, or both limit the efficiency of the Host execution
        domain.
      high: >
        High values indicate efficient Host execution with small parallel/offload
        losses and favorable Host computation scalability.
      above_100: >
        Values above 100% can occur when favorable Host computation scalability
        more than compensates Host parallel/offload losses; interpret them relative
        to the reference execution.
    typical_causes:
    - MPI overhead
    - Accelerator offload overhead
    - Poor host computation scalability
    next_steps:
    - Inspect Host Parallel Efficiency.
    - Inspect Host Computation Scalability.
    children:
    - host_parallel_eff
    - host_comp_scale
    sources:
    - basicanalysis_host_device
  host_parallel_eff:
    name: Host Parallel Efficiency
    short_name: Host PE
    family: host
    analysis_level: execution_domain
    metric_type: compound_efficiency
    definition: >
      Measures the parallel efficiency of the Host execution domain, accounting for
      losses associated with MPI execution and with offloading, managing, and
      waiting for accelerator activity.
    formula:
      text: HostPE = MPI_PE × DeviceOffloadE
      latex: HostPE = MPI\_PE \times DeviceOffloadE
    interpretation:
      low: >
        Low values indicate significant Host-side efficiency loss associated with
        MPI execution, accelerator offload activity, or both.
      high: >
        High values indicate small Host-side efficiency losses from MPI execution
        and accelerator offload activity.
      above_100: >
        Values above 100% are not expected and should be checked.
    typical_causes:
    - MPI overhead
    - Kernel launch overhead
    - Host-device synchronization
    - Host-device data movement
    - Waiting for accelerator execution
    next_steps:
      - Compare MPI Parallel Efficiency and Device Offload Efficiency.
    children:
    - mpi_parallel_eff
    - dev_offload_eff
    sources:
    - basicanalysis_host_device
  dev_offload_eff:
    name: Device Offload Efficiency
    short_name: Offload
    family: host
    analysis_level: execution_domain
    metric_type: efficiency
    definition: >
      Measures the efficiency of the Host execution domain with respect to
      accelerator offload activity, accounting for Host time spent managing or
      waiting for accelerator activity rather than performing useful Host
      computation.
    formula:
      text: DeviceOffloadE = sum C_i / sum(C_i + W_i)
      latex: DeviceOffloadE = \frac{\sum_{i=1}^{P} C_i}{\sum_{i=1}^{P} C_i + \sum_{i=1}^{P} W_i}
      variables:
        C_i: Useful CPU time of host process i
        W_i: CPU time waiting for or managing accelerator activity for process i
        P: Number of host processes
      status: model_specific
    interpretation:
      low: Low values indicate that a large fraction of host-side time is spent managing or waiting for accelerator
        activity. Very low values can be expected in applications whose host mainly feeds and waits for the device.
      high: >
        High values indicate that a small fraction of Host-side time is spent
        managing or waiting for accelerator activity relative to useful Host
        computation.
      above_100: Values above 100% are not expected and should be checked.
    typical_causes:
    - Offloading work to the accelerator
    - Kernel launch overhead
    - Waiting for kernels
    - Waiting for data
    - Sending data to the accelerator
    next_steps:
    - Compare with MPI Parallel Efficiency.
    - Inspect Host/Device transfers and synchronization.
    - Compare with Device Global Efficiency.
    children: []
    sources:
    - basicanalysis_host_device
  host_comp_scale:
    name: Host Computation Scalability
    short_name: Host Scale
    family: host
    analysis_level: execution_domain
    metric_type: compound_scalability
    definition: >
      Measures how the cost of useful Host computation changes relative to a
      reference execution as the application scales.
    formula:
      text: HostCompScale = host useful time at reference / host useful time at target
      latex: HostCompScale = \\frac{HostUseful_{ref}}{HostUseful_{target}}
    interpretation:
      low: >
        Low values indicate that useful Host computation becomes more expensive
        relative to the reference execution as the application scales.
      high: >
        Values near 100% indicate that the cost of useful Host computation is
        preserved relative to the reference execution.
      above_100: >
        Values above 100% indicate that useful Host computation becomes less
        expensive relative to the reference execution.
    typical_causes:
    - Lower host IPC
    - More host instructions
    - Frequency changes
    next_steps:
    - Inspect Host IPC, Instruction, and Frequency Scalability.
    children:
    - host_ipc_scale
    - host_inst_scale
    - host_freq_scale
    sources:
    - pop_standard_metrics
    - basicanalysis_host_device
  host_ipc_scale:
    name: Host IPC Scalability
    short_name: Host IPC
    family: host
    analysis_level: execution_domain
    metric_type: scalability
    definition: >
      Measures how the number of instructions executed per processor cycle during
      useful Host computation changes relative to a reference execution as the
      application scales.
    formula:
      text: HostIPCScale = HostIPC_target / HostIPC_reference
      latex: HostIPCScale = \frac{HostIPC_{target}}{HostIPC_{ref}}
      variables:
        HostIPC: Useful host instructions divided by useful host cycles
    interpretation:
      low: >
        Low values indicate that fewer instructions are executed per processor
        cycle during useful Host computation than in the reference execution.
      high: >
        Values near 100% indicate that the number of instructions executed per
        processor cycle during useful Host computation is preserved relative to
        the reference execution.
      above_100: >
        Values above 100% indicate that more instructions are executed per
        processor cycle during useful Host computation than in the reference
        execution.
    typical_causes:
    - Cache misses
    - Memory-bandwidth saturation
    - Pipeline stalls
    - NUMA effects
    next_steps:
    - Inspect host cache and memory counters.
    - Inspect NUMA placement and memory bandwidth.
    children: []
    sources:
    - pop_standard_metrics
    - basicanalysis_host_device
  host_inst_scale:
    name: Host Instruction Scalability
    short_name: Host Inst
    family: host
    analysis_level: execution_domain
    metric_type: scalability
    definition: >
      Measures how the number of instructions executed during useful Host
      computation changes relative to a reference execution as the application
      scales.
    formula:
      text: HostInstScale = host instructions_reference / host instructions_target
      latex: HostInstScale = \frac{HostInstructions_{ref}}{HostInstructions_{target}}
    interpretation:
      low: >
        Low values indicate that more instructions are executed during useful Host
        computation than in the reference execution.
      high: >
        Values near 100% indicate that the number of instructions executed during
        useful Host computation is preserved relative to the reference execution.
      above_100: >
        Values above 100% indicate that fewer instructions are executed during
        useful Host computation than in the reference execution.
    typical_causes:
    - Additional host-side parallel bookkeeping
    - Additional runtime or offload management
    - Redundant host computation
    - Algorithmic work growth on the host
    next_steps:
    - Compare useful host instruction counts across configurations.
    - Identify phases where the host instruction count changes.
    children: []
    sources:
    - pop_standard_metrics
    - basicanalysis_host_device
  host_freq_scale:
    name: Host Frequency Scalability
    short_name: Host Freq
    family: host
    analysis_level: execution_domain
    metric_type: scalability
    definition: >
      Measures how the processor frequency during useful Host computation changes
      relative to a reference execution as the application scales.
    formula:
      text: HostFreqScale = (UsefulCycles_target / HostUsefulTime_target) /
        (UsefulCycles_reference / HostUsefulTime_reference)
      latex: HostFreqScale =
        \frac{UsefulCycles_{target}/HostUsefulTime_{target}}
        {UsefulCycles_{ref}/HostUsefulTime_{ref}}
      variables:
        UsefulCycles: Total CPU cycles measured during useful host computation
        HostUsefulTime: Total useful host computation time
    interpretation:
      low: >
        Low values indicate a lower processor frequency during useful Host
        computation than in the reference execution.
      high: >
        Values near 100% indicate that the processor frequency during useful Host
        computation is preserved relative to the reference execution.
      above_100: >
        Values above 100% indicate a higher processor frequency during useful Host
        computation than in the reference execution.
    typical_causes:
    - Power limits
    - Thermal throttling
    - Turbo-frequency changes
    - Changes in CPU core occupancy
    next_steps:
    - Inspect CPU frequency and power behavior.
    - Compare the frequency behavior across the analyzed configurations.
    children: []
    sources:
    - pop_standard_metrics
    - basicanalysis_host_device

  dev_global_eff:
    name: Device Global Efficiency
    short_name: Device Global
    family: device
    analysis_level: execution_domain
    metric_type: compound_efficiency
    definition: >
      Measures the overall efficiency of the Device execution domain, accounting
      for losses associated with parallel Device execution together with changes
      in the scalability of useful Device computation.
    formula:
      text: DeviceGE = DevicePE × DeviceCompScale
      latex: DeviceGE = DevicePE \times DeviceCompScale
    interpretation:
      low: >
        Low values indicate that parallel Device execution, changes in Device
        computation scalability, or both limit the efficiency of the Device
        execution domain.
      high: >
        High values indicate efficient Device execution with small parallel losses
        and favorable Device computation scalability.
      above_100: >
        Values above 100% can occur when favorable Device computation scalability
        more than compensates Device parallel-execution losses; interpret them
        relative to the reference execution.
    typical_causes:
      - Device idle time
      - Device imbalance
      - Data movement
      - Device orchestration overhead
      - Reduced Device computation scalability
    next_steps:
    - Inspect Device Parallel Efficiency.
    - Inspect Device Computation Scalability.
    children:
    - dev_parallel_eff
    - dev_comp_scale
    sources:
    - basicanalysis_host_device
  dev_parallel_eff:
    name: Device Parallel Efficiency
    short_name: Device PE
    family: device
    analysis_level: execution_domain
    metric_type: compound_efficiency
    definition: >
      Measures the parallel efficiency of the Device execution domain in terms of
      the fraction of aggregate Device execution time spent performing useful
      Device computation.
    formula:
      text: DevicePE = sum G_i / (T × N) = DeviceLB × DeviceCommE × DeviceOrchesE
      latex: DevicePE = \frac{\sum_{i=1}^{N} G_i}{T \cdot N} = DeviceLB \times DeviceCommE \times DeviceOrchesE
      variables:
        G_i: Useful computation time of device i
        N: Number of devices
        T: Total elapsed time
    interpretation:
      low: >
        Low values indicate that a significant fraction of aggregate Device
        execution time is not spent performing useful Device computation.
      high: >
        High values indicate that most of the aggregate Device execution time is
        spent performing useful Device computation.
      above_100: >
        Values above 100% are not expected and should be checked.
    typical_causes:
    - Device imbalance
    - Data movement
    - Lack of available work
    - Kernel dependencies
    next_steps:
    - Inspect Device Load Balance.
    - Inspect Device Communication Efficiency.
    - Inspect Device Orchestration Efficiency.
    children:
    - dev_load_balance
    - dev_comm_eff
    - dev_orches_eff
    sources:
    - basicanalysis_host_device
  dev_load_balance:
    name: Device Load Balance
    short_name: Device LB
    family: device
    analysis_level: execution_domain
    metric_type: efficiency
    definition: >
      Measures how evenly useful computation time is distributed across the
      Devices.
    formula:
      text: DeviceLB = sum G_i / (N × max(G_i))
      latex: DeviceLB = \frac{\sum_{i=1}^{N} G_i}{N \cdot \max_i(G_i)}
      variables:
        G_i: Useful computation time of device i
        N: Number of devices
    interpretation:
      low: >
        Low values indicate that useful computation time is unevenly distributed
        across the Devices.
      high: >
        High values indicate that useful computation time is evenly distributed
        across the Devices.
      above_100: >
        Values above 100% are not expected and should be checked.
    typical_causes:
    - Uneven device assignment
    - Uneven kernel workload
    - Different work per process or GPU
    next_steps:
      - Inspect useful Device computation time per Device.
      - Identify Devices with significantly higher or lower useful computation time.
    children: []
    sources:
    - basicanalysis_host_device
  dev_comm_eff:
    name: Device Communication Efficiency
    short_name: Device Comm
    family: device
    analysis_level: execution_domain
    metric_type: efficiency
    definition: >
      Measures the efficiency of Device execution with respect to non-overlapped
      data movement, including transfers between Host and Device, between Devices,
      and accelerator-aware communication.
    formula:
      text: DeviceCommE = max(G_i) / max(G_j + D_j)
      latex: DeviceCommE = \frac{\max_i(G_i)}{\max_j(G_j + D_j)}
      variables:
        G_i: Useful computation time of device i
        D_i: Device data-movement time of device i that is not overlapped with computation
      status: model_specific
    interpretation:
      low: >
        Low values indicate significant efficiency loss associated with
        non-overlapped Device data movement.
      high: >
        High values indicate that non-overlapped Device data-movement overhead is
        small relative to useful Device computation.
      above_100: >
        Values above 100% are not expected and should be checked.
    typical_causes:
    - Host-to-device copies
    - Device-to-host copies
    - Device-to-device copies
    - NCCL communication
    - CUDA-aware MPI
    - Synchronization associated with transfers
    next_steps:
      - Inspect transfer direction, volume, and overlap with Device computation.
      - Inspect NCCL and CUDA-aware MPI activity when present.  
    children: []
    sources:
    - basicanalysis_host_device
  dev_orches_eff:
    name: Device Orchestration Efficiency
    short_name: Device Orch
    family: device
    analysis_level: execution_domain
    metric_type: efficiency
    definition: >
      Measures how continuously the Device is supplied with executable work,
      reflecting efficiency losses caused by periods in which Device work is
      unavailable.
    formula:
      text: DeviceOrchesE = max(G_i + D_i) / T
      latex: DeviceOrchesE = \frac{\max_i(G_i + D_i)}{T}
      variables:
        G_i: Useful computation time of device i
        D_i: Device data-movement time of device i that is not overlapped with computation
        T: Total elapsed time
      status: model_specific
    interpretation:
      low: >
        Low values indicate substantial periods in which executable Device work is
        unavailable.
      high: >
        High values indicate that the Device is supplied with executable work for
        most of the execution.
      above_100: >
        Values above 100% are not expected and should be checked.
    typical_causes:
    - Waiting for work from the host
    - Dependencies between kernels
    - Insufficient available device work
    next_steps:
      - Inspect kernel-launch timing and gaps between Device activities.
      - Inspect stream dependencies and overlap.
      - Inspect periods of Device idle time.
    children: []
    sources:
    - basicanalysis_host_device
  dev_comp_scale:
    name: Device Computation Scalability
    short_name: Device Scale
    family: device
    analysis_level: execution_domain
    metric_type: scalability

    definition: Measures how device useful-computation time changes relative to the reference execution as the application scales.
      For strong scaling, it evaluates the reduction in total device useful-computation time. For weak scaling, it evaluates
      the change in device useful-computation time normalized by the number of devices.

    formula:
      text: 'Strong: useful_device_ref / useful_device; Weak: (useful_device_ref / useful_device) * (devices / devices_ref)'
      latex: '\mathrm{DevCompScale}_{strong} = \frac{U_{dev,ref}}{U_{dev}}, \quad
        \mathrm{DevCompScale}_{weak} = \frac{U_{dev,ref}}{U_{dev}}\frac{D}{D_{ref}}'
      status: implemented

    interpretation:
      low: Low values indicate that useful computation on the devices takes longer than expected relative to the reference
        execution, reducing device-side computation scalability.
      high: Values close to 100% indicate that device useful-computation time scales as expected relative to the reference
        execution.
      above_100: Values above 100% indicate that device useful-computation time improved beyond the reference-based scaling
        expectation.

    typical_causes:
    - Reduced device computational throughput
    - Lower effective parallelism or occupancy
    - Increased SIMD/SIMT inefficiency or thread divergence
    - Increased memory-system pressure or less efficient memory-access behavior
    - Changes in instruction mix or computational intensity

    next_steps:
    - Compare device kernel execution and hardware-efficiency characteristics with the reference execution, including kernel
      durations, occupancy or available parallelism, SIMD/SIMT execution behavior, memory-system behavior, and instruction mix.

    children: []

    sources:
    - basicanalysis_host_device
  avg_frequency:
    name: Average Frequency
    short_name: Avg Frequency
    family: general
    analysis_level: application
    metric_type: performance_indicator

    definition: >
      Time-weighted average CPU operating frequency observed during the
      application execution. It is computed from the frequency histogram
      produced by BasicAnalysis, using the accumulated execution time in each
      frequency interval as the weight. It is a general execution-level
      performance indicator and is distinct from the effective frequency used
      to compute Frequency Scalability.

    formula:
      text: >
        AvgFrequency = sum(FrequencyBinMidpoint_i × Time_i) / sum(Time_i)

      latex: >
        AvgFrequency =
        \frac{\sum_i F_i T_i}{\sum_i T_i}

      variables:
        FrequencyBinMidpoint_i: Midpoint of frequency histogram interval i
        Time_i: Accumulated execution time in frequency histogram interval i

    interpretation:
      low: >
        A lower value indicates that the CPUs operated, on average, at a lower
        frequency during the execution.
      high: >
        A higher value indicates that the CPUs operated, on average, at a higher
        frequency during the execution.

    typical_causes:
      - CPU frequency policy
      - Turbo-frequency behavior
      - Power limits
      - Thermal throttling
      - Changes in CPU utilization

    next_steps:
      - Compare Average Frequency across execution configurations.
      - Inspect CPU frequency behavior in the trace when unexpected changes occur.

    children: []

    sources:
      - basicanalysis_general_metrics
  
  io_eff:
    name: I/O Efficiency
    short_name: I/O Eff
    family: io
    analysis_level: io
    metric_type: efficiency

    definition: >
      Complementary efficiency metric that characterizes the weight of File
      I/O activity relative to useful computation. It compares useful
      computation with the combined time associated with useful computation
      and File I/O. When I/O activity is negligible relative to useful
      computation, I/O Efficiency approaches 100%. As the contribution of I/O
      increases, I/O Efficiency decreases. The metric considers POSIX and
      ANSI C File I/O and MPI-I/O activity observed in the trace and is
      reported independently from the hierarchical performance-efficiency
      model.

    formula:
      text: >
        IO_Eff = Useful / (Useful + POSIX_IO + MPI_IO)

      latex: >
        IO\_Eff =
        \frac{Useful}
        {Useful + POSIXIO + MPIIO}

      variables:
        Useful: Total useful computation time
        POSIX_IO: Total POSIX and ANSI C File I/O activity measured in the trace
        MPI_IO: Total MPI-I/O activity measured in the trace

    interpretation:
      low: >
        Low values indicate that File I/O activity has a significant weight
        relative to useful computation.
      high: >
        High values indicate that File I/O activity is negligible or small
        relative to useful computation.
      above_100: >
        Values above 100% are not expected for I/O Efficiency and should be
        checked.

    typical_causes:
      - Significant POSIX or ANSI C File I/O activity
      - Significant MPI-I/O activity
      - Frequent read or write operations
      - Large File I/O data volumes

    next_steps:
      - Compare MPI I/O Efficiency and POSIX I/O Efficiency.
      - Inspect File I/O activity in the trace.
      - Examine the I/O access pattern when File I/O represents a significant
        fraction of the considered execution activity.

    children: []

    availability: >
      Reported as Non-Avail when neither POSIX/ANSI C nor MPI-I/O activity is
      detected in the analyzed execution.

    sources:
      - basicanalysis_io_metrics  

  mpi_io_eff:
    name: MPI I/O Efficiency
    short_name: MPI I/O
    family: io
    analysis_level: io
    metric_type: efficiency

    definition: >
      Complementary efficiency metric that characterizes the fraction of
      aggregate execution capacity not spent in MPI-I/O activity. Higher
      values therefore correspond to a smaller MPI-I/O contribution to the
      measured execution. The metric is reported independently from the
      hierarchical performance-efficiency model.

    formula:
      text: >
        MPI_IO_Eff = 1 - MPI_IO / (P × T)

      latex: >
        MPI\_IO\_Eff =
        1 - \frac{MPIIO}{P \cdot T}

      variables:
        MPIIO: Total MPI-I/O duration accumulated across the execution units represented in the measurement
        P: Number of parallel execution units considered by the metric
        T: Application execution time

    interpretation:
      low: >
        Low values indicate that MPI-I/O activity consumes a significant
        fraction of the aggregate execution capacity.
      high: >
        High values indicate that little aggregate execution capacity is
        spent in MPI-I/O activity.
      above_100: >
        Values above 100% are not expected for MPI I/O Efficiency and should
        be checked.

    typical_causes:
      - Frequent MPI-I/O operations
      - Large MPI-I/O data volumes
      - Collective or independent MPI-I/O activity
      - I/O phases with significant duration

    next_steps:
      - Inspect MPI-I/O activity in the trace.
      - Examine the frequency and duration of MPI-I/O operations.
      - Compare MPI-I/O behavior across execution configurations.

    children: []

    availability: >
      Reported as Non-Avail when no MPI-I/O activity is detected in the
      analyzed execution.

    sources:
      - basicanalysis_io_metrics


  mpi_io_load_balance:
    name: MPI I/O Load Balance
    short_name: MPI I/O LB
    family: io
    analysis_level: io
    metric_type: efficiency

    definition: >
      Complementary I/O metric that characterizes how evenly MPI-I/O activity
      is distributed across the execution units represented in the MPI-I/O
      measurement. It compares the average MPI-I/O duration with the maximum
      MPI-I/O duration.

    formula:
      text: >
        MPI_IO_LB = average MPI-I/O time / maximum MPI-I/O time

      latex: >
        MPI\_IO\_LB =
        \frac{\overline{MPIIO}}
        {\max(MPIIO)}

      variables:
        MPIIO: MPI-I/O duration measured for the execution units represented in the analysis

    interpretation:
      low: >
        Low values indicate that MPI-I/O activity is unevenly distributed,
        with some execution units spending substantially more time in MPI-I/O
        than others.
      high: >
        High values indicate that MPI-I/O activity is similarly distributed
        across the execution units represented in the measurement.
      above_100: >
        Values above 100% are not expected for MPI I/O Load Balance and should
        be checked.

    typical_causes:
      - Uneven MPI-I/O operation distribution
      - Different I/O volumes across MPI ranks
      - Rank-specific I/O phases
      - Serialized or aggregator-dominated MPI-I/O activity

    next_steps:
      - Inspect MPI-I/O duration per MPI rank.
      - Identify ranks responsible for the largest MPI-I/O time.
      - Examine collective and independent MPI-I/O behavior in the trace.

    children: []

    availability: >
      Reported as Non-Avail when no MPI-I/O activity is detected in the
      analyzed execution.

    sources:
      - basicanalysis_io_metrics


  posix_io_eff:
    name: POSIX I/O Efficiency
    short_name: POSIX I/O
    family: io
    analysis_level: io
    metric_type: efficiency
    definition: >
      Complementary efficiency metric that characterizes the fraction of
      aggregate execution capacity not spent in POSIX and ANSI C File I/O
      activity captured by the trace. Higher values therefore correspond to a
      smaller File I/O contribution to the measured execution. The metric is
      reported independently from the hierarchical performance-efficiency
      model.
    formula:
      text: >
        POSIX_IO_Eff = 1 - POSIX_IO / (P × T)

      latex: >
        POSIX\_IO\_Eff =
        1 - \frac{POSIXIO}{P \cdot T}
      variables:
        POSIXIO: Total POSIX and ANSI C File I/O duration accumulated across the execution units represented in the measurement
        P: Number of parallel execution units considered by the metric
        T: Application execution time
    interpretation:
      low: >
        Low values indicate that POSIX and ANSI C File I/O activity consumes
        a significant fraction of the aggregate execution capacity.
      high: >
        High values indicate that little aggregate execution capacity is spent
        in POSIX and ANSI C File I/O activity.
      above_100: >
        Values above 100% are not expected for POSIX I/O Efficiency and should
        be checked.
    typical_causes:
      - Frequent POSIX or ANSI C read/write operations
      - Large File I/O data volumes
      - Serialized File I/O
      - I/O phases with significant duration
    next_steps:
      - Inspect POSIX and ANSI C File I/O activity in the trace.
      - Examine the frequency and duration of File I/O operations.
      - Compare File I/O behavior across execution configurations.
    children: []
    availability: >
      Reported as Non-Avail when no POSIX or ANSI C File I/O activity is
      detected in the analyzed execution.
    sources:
      - basicanalysis_io_metrics

  posix_io_load_balance:
    name: POSIX I/O Load Balance
    short_name: POSIX I/O LB
    family: io
    analysis_level: io
    metric_type: efficiency
    definition: >
      Complementary I/O metric that characterizes how evenly POSIX and ANSI C
      File I/O activity is distributed across the execution units represented
      in the I/O measurement. It compares the average POSIX/ANSI C I/O duration
      with the maximum POSIX/ANSI C I/O duration.
    formula:
      text: >
        POSIX_IO_LB = average POSIX/ANSI C I/O time / maximum POSIX/ANSI C I/O time
      latex: >
        POSIX\_IO\_LB =
        \frac{\overline{POSIXIO}}
        {\max(POSIXIO)}
      variables:
        POSIXIO: POSIX and ANSI C File I/O duration measured for the execution units represented in the analysis
    interpretation:
      low: >
        Low values indicate that POSIX and ANSI C File I/O activity is unevenly
        distributed, with some execution units spending substantially more
        time in File I/O than others.
      high: >
        High values indicate that POSIX and ANSI C File I/O activity is
        similarly distributed across the execution units represented in the
        measurement.
      above_100: >
        Values above 100% are not expected for POSIX I/O Load Balance and
        should be checked.
    typical_causes:
      - Uneven distribution of File I/O operations
      - Different I/O volumes across execution units
      - Serialized or rank-specific File I/O activity
    next_steps:
      - Inspect POSIX and ANSI C File I/O duration per execution unit.
      - Identify execution units responsible for the largest File I/O time.
      - Inspect the distribution of File I/O operations in the trace.
    children: []
    availability: >
      Reported as Non-Avail when no POSIX or ANSI C File I/O activity is
      detected in the analyzed execution.
    sources:
      - basicanalysis_io_metrics


  dev_hwc_sm_utilization:
    name: SM Utilization
    short_name: SM Util
    family: gpu_hwc
    analysis_level: hardware_counters
    metric_type: compound_efficiency
    definition: >
      Fraction of GPU-active time during which the SMs are issuing
      instructions. It combines how broadly work is distributed across the
      SMs (SM Coverage) with how effectively active SMs issue instructions
      (SM Issue Efficiency).
    formula:
      text: SM_Util = SM_Coverage × SM_Issue_Eff = integral(SM_Issue) / integral(GR_Active)
      latex: SM\_Util = SM\_Coverage \times SM\_Issue = \frac{\int SM^{Issue}\,dt}{\int GR^{Active}\,dt}
      variables:
        SM_Issue: >
          Percentage of cycles in which the SM sub-partitions issue an
          instruction.
        GR_Active: >
          Percentage of cycles in which the GPU Graphics/Compute Engine
          is active.
    interpretation:
      low: >
        The GPU has low SM instruction-issue activity while it is active.
        This can result from limited SM Coverage, low SM Issue Efficiency,
        or both.
      high: >
        The GPU has high SM instruction-issue activity while it is active,
        indicating both broad use of the available SMs and effective
        instruction issue within the active SMs.
      above_100: >
        Values above 100% are not expected and should be checked.
    typical_causes:
      - Insufficient parallelism or too few thread blocks to keep all SMs active
      - Low occupancy, reducing the number of warps available to hide latency
      - Memory stalls that prevent active warps from issuing instructions
      - Instruction or execution dependencies that limit instruction issue
    next_steps:
      - Inspect SM Coverage and SM Issue Efficiency to determine which component limits SM Utilization.
      - If SM Coverage is low, check kernel parallelism, grid size, and the number of active blocks across the SMs.
      - If SM Issue Efficiency is low, inspect occupancy, memory behavior, and sources of instruction stalls.
      - Inspect DRAM Bandwidth when memory stalls are suspected.
      - Inspect Tensor Core Activity only for kernels expected to use Tensor Cores.
    children:
      - dev_hwc_sm_coverage
      - dev_hwc_sm_issue_eff
    availability: >
      Only for nsys2prv traces with sampled GPU metrics; Non-Avail otherwise.
    sources:
      - basicanalysis_gpu_hwc

  dev_hwc_sm_coverage:
    name: SM Coverage
    short_name: SM Coverage
    family: gpu_hwc
    analysis_level: hardware_counters
    metric_type: efficiency
    definition: >
      Fraction of the available SM capacity that is active while the GPU
      is active. An SM is considered active when it has at least one warp
      in flight.
    formula:
      text: SM_Coverage = integral(SMs_Active) / integral(GR_Active)
      latex: SM\_Coverage = \frac{\int SMs^{Active}\,dt}{\int GR^{Active}\,dt}
      variables:
        SMs_Active: >
          Percentage of SM cycles in which the SMs have at least one
          warp in flight.
        GR_Active: >
          Percentage of cycles in which the GPU Graphics/Compute Engine
          is active.
    interpretation:
      low: >
        A significant fraction of the available SM capacity is inactive
        while the GPU is active, indicating that the workload does not
        expose enough parallelism to use all SMs effectively.
      high: >
        Most of the available SM capacity is active while the GPU is
        active, indicating that work is broadly distributed across the SMs.
      above_100: >
        Values above 100% are not expected and should be checked.
    typical_causes:
      - Small grids with insufficient thread blocks to distribute work across all SMs
      - Kernel tail effects, where only a few thread blocks remain active near kernel completion
      - Work decomposition that exposes insufficient parallelism to the GPU
    next_steps:
      - Inspect kernel grid dimensions (Kernel GrdX/Y/Z events) and compute the total number of thread blocks (GrdX × GrdY × GrdZ).
      - Compare the number of thread blocks with the number of SMs to identify kernels with insufficient parallelism.
      - Check for kernel tail effects where only a small number of blocks remain active.
    children: []
    sources:
      - basicanalysis_gpu_hwc

  dev_hwc_sm_issue_eff:
    name: SM Issue Efficiency
    short_name: SM Issue
    family: gpu_hwc
    analysis_level: hardware_counters
    metric_type: efficiency
    definition: >
      Fraction of active-SM activity during which the SM sub-partitions
      issue instructions. SM activity is measured over SM cycles with at
      least one warp in flight.
    formula:
      text: SM_Issue_Eff = integral(SM_Issue) / integral(SMs_Active)
      latex: SM\_Issue\_Eff = \frac{\int SM^{Issue}\,dt}{\int SMs^{Active}\,dt}
      variables:
        SM_Issue: >
          Percentage of cycles in which the SM sub-partitions issue an
          instruction.
        SMs_Active: >
          Percentage of SM cycles in which the SMs have at least one
          warp in flight.
    interpretation:
      low: >
        Active SMs spend a significant fraction of their activity without
        issuing instructions, indicating limited instruction-issue efficiency.
      high: >
        Active SMs issue instructions during most of their activity,
        indicating effective use of the SM instruction-issue capability.
      above_100: >
        Values above 100% are not expected and should be checked.
    typical_causes:
      - Memory latency that leaves active warps waiting for data
      - Insufficient active warps to hide instruction or memory latency
      - Data or instruction dependencies that prevent ready warps from issuing
      - Synchronization or control-flow effects that reduce the number of ready warps
    next_steps:
      - Inspect Achieved Occupancy to determine whether enough warps are available to hide latency.
      - Inspect DRAM Bandwidth and memory behavior to identify possible memory-related limitations.
      - Inspect warp stall reasons, when available, to identify why active warps are not issuing instructions.
    children: []
    sources:
      - basicanalysis_gpu_hwc

  dev_hwc_gpu_active:
    name: GPU Active (HW counters)
    short_name: GPU Active
    family: gpu_hwc
    analysis_level: hardware_counters
    metric_type: performance_indicator
    definition: >
      Average fraction of the execution time during which the GPU
      graphics/compute engine is active across the devices with sampled
      hardware counters. For compute workloads, this indicates periods in
      which the compute engine is processing work. Activity of the
      independent GPU copy engines is not included.
    formula:
      text: GPU_Active = sum_d integral(GR_Active_d) / (N × T)
      latex: GPU\_Active = \frac{\sum_d \int GR^{Active}_d\,dt}{N \cdot T}
      variables:
        GR_Active_d: >
          Percentage of cycles in which the Graphics/Compute Engine of
          device d is active.
        N: Number of devices with sampled hardware counters
        T: Execution runtime
    interpretation:
      reading: >
        This is an activity indicator rather than a measure of GPU
        efficiency. Compare it with the fraction of execution time covered
        by GPU kernels as a consistency check. GPU idle periods and their
        impact on application performance are assessed with the Device
        metrics of the Host/Device Model.
      low: >
        The GPU graphics/compute engines are active during a relatively
        small fraction of the execution.
      high: >
        The GPU graphics/compute engines are active during a relatively
        large fraction of the execution.
    next_steps:
      - >
        Compare GPU Active with the fraction of execution time covered by
        GPU kernels; a large discrepancy may indicate sampling,
        trace-conversion, or counter-interpretation issues.
      - >
        Use the Device metrics of the Host/Device Model (TALP) to assess
        GPU idle periods and their impact on application performance.
    children: []
    availability: >
      Only for nsys2prv traces with sampled GPU metrics (Metrics GPU<n>
      threads); Non-Avail otherwise.
    sources:
      - basicanalysis_gpu_hwc


  dev_hwc_achieved_occupancy:
    name: Achieved Occupancy (run average)
    short_name: Achieved Occ.
    family: gpu_hwc
    analysis_level: hardware_counters
    metric_type: performance_indicator
    definition: >
      Average fraction of the maximum warp capacity occupied by resident
      compute warps while the SMs are active. It is an execution-level
      indicator computed across all GPU activity, rather than the
      per-kernel achieved occupancy of a specific kernel.
    formula:
      text: AchievedOcc = integral(Warps_in_Flight) / integral(SMs_Active)
      latex: AchievedOcc = \frac{\int Warps^{Flight}\,dt}{\int SMs^{Active}\,dt}
      variables:
        Warps_in_Flight: >
          Percentage of the maximum warp capacity occupied by resident
          compute warps, averaged across the SMs.
        SMs_Active: >
          Percentage of SM cycles in which the SMs have at least one
          warp in flight.
    interpretation:
      reading: >
        Higher is not necessarily better. Low achieved occupancy becomes
        relevant when there are not enough resident warps to hide latency,
        particularly when SM Issue Efficiency is also low. Kernels with
        sufficient instruction-level parallelism or substantial work per
        thread can perform well at lower occupancy. This is an execution-level
        average and should not be compared directly with the per-kernel
        achieved occupancy reported by Nsight Compute unless one kernel
        dominates the execution.
      low: >
        A relatively small fraction of the available warp slots is occupied
        by resident warps while the SMs are active.
      high: >
        A relatively large fraction of the available warp slots is occupied
        by resident warps while the SMs are active.
    typical_causes:
      - High register usage per thread limiting the number of resident warps or blocks
      - High shared-memory usage per block limiting the number of resident blocks
      - Block size limiting the number of resident warps
      - Small grids providing insufficient concurrent work
    next_steps:
      - Inspect Kernel Registers/Thread and Shared Memory events for resource limits that may restrict resident blocks or warps.
      - Inspect kernel grid and block dimensions to determine whether enough parallel work is available.
      - Compare Achieved Occupancy with SM Issue Efficiency; low occupancy is more relevant when instruction issue is also limited.
      - Profile dominant kernels with Nsight Compute to analyze their theoretical and per-kernel achieved occupancy.
    children: []
    sources:
      - basicanalysis_gpu_hwc

  dev_hwc_tensor_activity:
    name: Tensor Core Activity
    short_name: Tensor
    family: gpu_hwc
    analysis_level: hardware_counters
    metric_type: performance_indicator
    definition: >
      Fraction of GPU-active time during which the Tensor Core pipelines
      are active.
    formula:
      text: Tensor = integral(Tensor_Active) / integral(GR_Active)
      latex: Tensor = \frac{\int Tensor^{Active}\,dt}{\int GR^{Active}\,dt}
      variables:
        Tensor_Active: >
          Percentage of cycles in which the Tensor Core pipelines are
          active.
        GR_Active: >
          Percentage of cycles in which the GPU Graphics/Compute Engine
          is active.
    interpretation:
      reading: >
        Workload dependent. Low activity is expected for applications that
        do not use Tensor Core operations. For workloads expected to benefit
        from Tensor Cores, low activity may indicate that the Tensor Cores
        are not being effectively used.
      low: >
        Tensor Core pipeline activity is observed during a relatively small
        fraction of the GPU-active time.
      high: >
        Tensor Core pipeline activity is observed during a relatively large
        fraction of the GPU-active time.
    next_steps:
      - For workloads expected to use Tensor Cores, identify the dominant kernels and verify that they perform Tensor Core-eligible operations.
      - Check the numerical precision and data types used by these kernels (e.g. FP16, BF16, TF32 where appropriate).
      - For library-based matrix operations, verify that the selected library routines and configuration enable Tensor Core execution.
    children: []
    sources:
      - basicanalysis_gpu_hwc

  dev_hwc_dram_read:
    name: DRAM Read Bandwidth
    short_name: DRAM Read
    family: gpu_hwc
    analysis_level: hardware_counters
    metric_type: performance_indicator
    definition: >
      Average DRAM read bandwidth during GPU-active periods, expressed as
      a percentage of the hardware-specific peak sustained rate reported
      by the sampled NVIDIA GPU metric.
    formula:
      text: DRAM_Read = integral(DRAM_Read_BW × GR_Active) / integral(GR_Active)
      latex: DRAM\_Read = \frac{\int DRAM^{Read} \cdot GR^{Active}\,dt}{\int GR^{Active}\,dt}
      variables:
        DRAM_Read_BW: >
          DRAM read throughput reported by NVIDIA as a percentage of the
          hardware-specific peak sustained rate.
        GR_Active: >
          Percentage of cycles in which the GPU Graphics/Compute Engine
          is active.
    interpretation:
      reading: >
        Workload dependent. High DRAM read bandwidth indicates intensive
        use of the device memory system, but does not by itself indicate
        a performance limitation. Interpret it together with SM Issue
        Efficiency and the expected memory behavior of the workload.
      low: >
        DRAM reads use a relatively small fraction of the hardware-specific
        peak sustained rate during GPU-active periods.
      high: >
        DRAM reads use a relatively large fraction of the hardware-specific
        peak sustained rate during GPU-active periods.
    next_steps:
      - >
        Compare DRAM Read Bandwidth with SM Issue Efficiency. High DRAM
        bandwidth together with low SM Issue Efficiency may indicate that
        memory bandwidth is limiting instruction progress.
      - >
        Profile the dominant kernels with Nsight Compute to determine
        whether they are memory-bandwidth limited and to inspect memory
        hierarchy behavior.
      - >
        If memory bandwidth is confirmed as a limitation, investigate data
        reuse, memory access patterns, and opportunities to reduce DRAM
        traffic.
    children: []
    sources:
      - basicanalysis_gpu_hwc

  dev_hwc_dram_write:
    name: DRAM Write Bandwidth
    short_name: DRAM Write
    family: gpu_hwc
    analysis_level: hardware_counters
    metric_type: performance_indicator
    definition: >
      Average DRAM write bandwidth during GPU-active periods, expressed as
      a percentage of the hardware-specific peak sustained rate reported
      by the sampled NVIDIA GPU metric.
    formula:
      text: DRAM_Write = integral(DRAM_Write_BW × GR_Active) / integral(GR_Active)
      latex: DRAM\_Write = \frac{\int DRAM^{Write} \cdot GR^{Active}\,dt}{\int GR^{Active}\,dt}
      variables:
        DRAM_Write_BW: >
          DRAM write throughput reported by NVIDIA as a percentage of the
          hardware-specific peak sustained rate.
        GR_Active: >
          Percentage of cycles in which the GPU Graphics/Compute Engine
          is active.
    interpretation:
      reading: >
        Workload dependent. High DRAM write bandwidth indicates intensive
        use of the device memory system for writes, but does not by itself
        indicate a performance limitation. Interpret it together with DRAM
        Read Bandwidth, SM Issue Efficiency, and the expected memory behavior
        of the workload.
      low: >
        DRAM writes use a relatively small fraction of the hardware-specific
        peak sustained rate during GPU-active periods.
      high: >
        DRAM writes use a relatively large fraction of the hardware-specific
        peak sustained rate during GPU-active periods.
    next_steps:
      - >
        Compare DRAM Write Bandwidth with DRAM Read Bandwidth to characterize
        the read/write behavior of the workload.
      - >
        Compare DRAM bandwidth with SM Issue Efficiency. High DRAM bandwidth
        together with low SM Issue Efficiency may indicate that memory
        bandwidth is limiting instruction progress.
      - >
        Profile the dominant kernels with Nsight Compute to determine
        whether they are memory-bandwidth limited and to inspect memory
        hierarchy behavior.
      - >
        If memory bandwidth is confirmed as a limitation, investigate data
        reuse, memory access patterns, and opportunities to reduce DRAM
        traffic.
    children: []
    sources:
      - basicanalysis_gpu_hwc

  dev_hwc_gpc_clock:
    name: GPC Clock
    short_name: GPC Clock
    family: gpu_hwc
    analysis_level: hardware_counters
    metric_type: performance_indicator
    definition: >
      Average GPC (Graphics Processing Cluster) clock frequency during
      GPU-active periods.
    formula:
      text: Clock = integral(GPC_Clock × GR_Active) / integral(GR_Active)
      latex: Clock = \frac{\int f_{GPC} \cdot GR^{Active}\,dt}{\int GR^{Active}\,dt}
      variables:
        GPC_Clock: >
          GPC (Graphics Processing Cluster) clock frequency, recorded in
          Hz by nsys2prv.
        GR_Active: >
          Percentage of cycles in which the GPU Graphics/Compute Engine
          is active.
    interpretation:
      reading: >
        Workload- and system-dependent. The absolute clock frequency is
        not a performance quality measure and should not be interpreted
        as good or bad on its own. It is most useful when comparing
        executions on the same GPU model and under comparable system
        conditions.
      low: >
        A relatively low GPC clock frequency is observed during
        GPU-active periods.
      high: >
        A relatively high GPC clock frequency is observed during
        GPU-active periods.
    next_steps:
      - >
        Compare GPC Clock across executions on the same GPU model and
        under comparable system conditions; an unexpectedly lower clock
        may help explain a performance difference.
      - >
        If an unexpectedly low clock is observed, inspect GPU clock,
        power, temperature, and throttling information (e.g. with
        nvidia-smi) to determine whether power, thermal, or clock limits
        are involved.
    children: []
    sources:
      - basicanalysis_gpu_hwc
