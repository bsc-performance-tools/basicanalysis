#ParaverCFG
ConfigFile.Version: 3.4
ConfigFile.NumWindows: 13
ConfigFile.BeginDescription
Useful Duration for nsys2prv traces with MPI events: as the nsys2prv
version, but the host intervals are also outside MPI calls (events
50000001-50000005), as the Host useful time of BasicAnalysis for these
traces.
ConfigFile.EndDescription
